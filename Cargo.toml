[workspace]
resolver = "2"
members = ["crates/mc-core", "app/src-tauri"]
exclude = ["poc"]

[workspace.dependencies]
russh = "0.65"
russh-sftp = "3.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
log = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true

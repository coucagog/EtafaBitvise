# Vérifie et construit MLS Connect sur les trois systèmes de bureau.
# Android reste construit en local : voir scripts/attendre-et-tester.ps1 (-ApkApp, -GradleApp).
name: Construction

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bureau:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libsecret-1-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Interface
        working-directory: app
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm run check
          npm run build

      - name: Tests du cœur
        run: cargo test -p mc-core -p mc-mcp

      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Construction
        working-directory: app
        run: cargo tauri build --debug --no-bundle
